name: CI

on:
  push:
    branches-ignore:
      - ci-baseline
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Which CI matrix to run
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - extended
      publish_baseline:
        description: Force baseline from successful targets (scope=all, default branch only)
        required: true
        default: false
        type: boolean
  schedule:
    # Full/extended matrix once a week. Times are UTC.
    - cron: '17 4 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dist:
    name: Distribution tarball
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install distribution-build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake libtool pkg-config docbook2x libncurses-dev make

      - name: Build release-style tarball
        run: |
          set -euxo pipefail
          LSG_VERSION=$(git rev-parse --short=8 HEAD)
          ./autogen.sh
          ./configure
          make distcheck VERSION="$LSG_VERSION"
          test -n "$(find . -maxdepth 1 -name 'libstatgrab-*.tar.gz' -print -quit)"

      - name: Upload distribution tarball
        uses: actions/upload-artifact@v7
        with:
          name: distfile
          path: libstatgrab-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  master-snapshot:
    name: Publish master snapshot
    if: >-
      github.repository == 'libstatgrab/libstatgrab' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: dist
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_TAG: master-snapshot
    steps:
      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Prepare public snapshot
        run: |
          set -euxo pipefail
          set -- dist/libstatgrab-*.tar.gz
          test "$#" -eq 1
          cp "$1" libstatgrab-master.tar.gz
          sha256sum libstatgrab-master.tar.gz > libstatgrab-master.tar.gz.sha256

      - name: Publish rolling prerelease
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          cat > snapshot-notes.md <<EOF
          Automated release-style snapshot of [${COMMIT_SHA}](https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}) from the repository default branch.

          This is a development snapshot, not a formal libstatgrab release.
          EOF

          # Keep the rolling tag aligned with the commit that produced the assets.
          if gh api "repos/${REPOSITORY}/git/ref/tags/${SNAPSHOT_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$COMMIT_SHA" \
              -F force=true
          else
            gh api --method POST \
              "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/${SNAPSHOT_TAG}" \
              -f sha="$COMMIT_SHA"
          fi

          if gh release view "$SNAPSHOT_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$SNAPSHOT_TAG" \
              --repo "$REPOSITORY" \
              --title "Latest master snapshot" \
              --notes-file snapshot-notes.md \
              --prerelease
            gh release upload "$SNAPSHOT_TAG" \
              libstatgrab-master.tar.gz \
              libstatgrab-master.tar.gz.sha256 \
              --repo "$REPOSITORY" \
              --clobber
          else
            gh release create "$SNAPSHOT_TAG" \
              libstatgrab-master.tar.gz \
              libstatgrab-master.tar.gz.sha256 \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "Latest master snapshot" \
              --notes-file snapshot-notes.md \
              --prerelease \
              --latest=false
          fi

  native:
    name: Build & test — ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    strategy:
      fail-fast: false
      matrix: &native_matrix
        include:
          - slug: ubuntu-22.04-x86_64
            runner: ubuntu-22.04
            label: Ubuntu 22.04 (x86_64)
          - slug: ubuntu-24.04-x86_64
            runner: ubuntu-24.04
            label: Ubuntu 24.04 (x86_64)
          - slug: ubuntu-26.04-x86_64
            runner: ubuntu-26.04
            label: Ubuntu 26.04 (x86_64)
          - slug: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            label: Ubuntu 24.04 (ARM64)
          - slug: macos-15-x86_64
            runner: macos-15-intel
            label: macOS 15 (Intel)
          - slug: macos-26-arm64
            runner: macos-26
            label: macOS 26 (Apple Silicon)
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Install dependencies, build and test
        shell: bash
        run: CI_INSTALL_DEPS=1 sh .github/ci/run-target.sh '${{ matrix.slug }}'

      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.slug }}
          path: .ci-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate target failure
        shell: bash
        run: sh .github/ci/check-result.sh '${{ matrix.slug }}'

  warnings-native:
    name: Warnings — ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    strategy:
      fail-fast: false
      matrix: *native_matrix
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Run -Wall -Werror build
        shell: bash
        run: CI_INSTALL_DEPS=1 sh .github/ci/run-warning-target.sh '${{ matrix.slug }}'

      - name: Report warning-build failure
        id: warning_result
        if: always()
        shell: bash
        run: sh .github/ci/check-warning-result.sh '${{ matrix.slug }}'

      - name: Upload warning-build log
        if: always() && steps.warning_result.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: warnings-${{ matrix.slug }}
          path: .ci-warning-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
    continue-on-error: true
  linux-vm:
    name: Build & test — ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    strategy:
      fail-fast: false
      matrix: &linux_matrix
        include:
          - slug: debian-13-x86_64
            template: debian-13
            label: Debian 13 (x86_64)
          - slug: fedora-44-x86_64
            template: fedora-44
            label: Fedora 44 (x86_64)
          - slug: almalinux-10-x86_64
            template: almalinux-10
            label: AlmaLinux 10 (x86_64)
          - slug: rocky-8-x86_64
            template: rocky-8
            label: Rocky Linux 8 (x86_64)
          - slug: rocky-9-x86_64
            template: rocky-9
            label: Rocky Linux 9 (x86_64)
          - slug: rocky-10-x86_64
            template: rocky-10
            label: Rocky Linux 10 (x86_64)
          - slug: opensuse-leap-16-x86_64
            template: opensuse-leap-16
            label: openSUSE Leap 16 (x86_64)
          # Lima has no built-in alpine-3.24 template yet; bump this when it does.
          - slug: alpine-3.23-x86_64
            template: alpine-3.23
            label: Alpine Linux 3.23 (x86_64)
          - slug: archlinux-x86_64
            template: archlinux
            label: Arch Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1

      - name: Boot Linux VM
        run: |
          set -euxo pipefail
          sh .github/ci/start-lima.sh '${{ matrix.template }}'
          limactl shell default -- sh -c 'rm -rf /tmp/libstatgrab && mkdir -p /tmp/libstatgrab'
          limactl copy --backend=scp -r .github dist default:/tmp/libstatgrab/

      - name: Build, smoke-test and run test suite in VM
        run: >-
          limactl shell default -- sh -c
          "cd /tmp/libstatgrab && CI_INSTALL_DEPS=1 sh .github/ci/run-target.sh '${{ matrix.slug }}'"

      - name: Copy result out of VM
        if: always()
        run: |
          mkdir -p .ci-output
          limactl copy --backend=scp -r \
            default:/tmp/libstatgrab/.ci-output/${{ matrix.slug }} \
            .ci-output/ || true

      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.slug }}
          path: .ci-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Linux VM
        if: always()
        run: limactl stop default || true

      - name: Propagate target failure
        run: sh .github/ci/check-result.sh '${{ matrix.slug }}'

  warnings-linux-vm:
    name: Warnings — ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    strategy:
      fail-fast: false
      matrix: *linux_matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1

      - name: Boot Linux VM
        run: |
          set -euxo pipefail
          sh .github/ci/start-lima.sh '${{ matrix.template }}'
          limactl shell default -- sh -c 'rm -rf /tmp/libstatgrab && mkdir -p /tmp/libstatgrab'
          limactl copy --backend=scp -r .github dist default:/tmp/libstatgrab/

      - name: Run -Wall -Werror build
        run: >-
          limactl shell default -- sh -c "cd /tmp/libstatgrab && CI_INSTALL_DEPS=1 sh .github/ci/run-warning-target.sh '${{ matrix.slug }}'"

      - name: Copy result out of VM
        if: always()
        run: |
          mkdir -p .ci-warning-output
          limactl copy --backend=scp -r \
            default:/tmp/libstatgrab/.ci-warning-output/${{ matrix.slug }} \
            .ci-warning-output/ || true

      - name: Stop Linux VM
        if: always()
        run: limactl stop default || true

      - name: Report warning-build failure
        id: warning_result
        if: always()
        run: sh .github/ci/check-warning-result.sh '${{ matrix.slug }}'

      - name: Upload warning-build log
        if: always() && steps.warning_result.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: warnings-${{ matrix.slug }}
          path: .ci-warning-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
    continue-on-error: true
  unix-vm:
    name: Build & test — ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    strategy:
      fail-fast: false
      matrix: &unix_matrix
        include:
          - slug: freebsd-15.1-x86_64
            os: freebsd
            version: '15.1'
            architecture: x86-64
            label: FreeBSD 15.1 (x86_64)
          - slug: freebsd-14.4-x86_64
            os: freebsd
            version: '14.4'
            architecture: x86-64
            label: FreeBSD 14.4 (x86_64)
          - slug: openbsd-7.9-x86_64
            os: openbsd
            version: '7.9'
            architecture: x86-64
            label: OpenBSD 7.9 (x86_64)
          - slug: dragonflybsd-6.4.2-x86_64
            os: dragonflybsd
            version: '6.4.2'
            architecture: x86-64
            label: DragonFlyBSD 6.4.2 (x86_64)
          - slug: omnios-r151058-x86_64
            os: omnios
            version: 'r151058'
            architecture: x86-64
            label: OmniOS r151058 (x86_64)
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Boot ${{ matrix.os }} VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.architecture }}
          memory: 5G
          cpu_count: 2

      - name: Install dependencies, build and test in VM
        run: CI_INSTALL_DEPS=1 sh .github/ci/run-target.sh '${{ matrix.slug }}'

      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.slug }}
          path: .ci-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate target failure
        shell: bash
        run: sh .github/ci/check-result.sh '${{ matrix.slug }}'

  warnings-unix-vm:
    name: Warnings — ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    strategy:
      fail-fast: false
      matrix: *unix_matrix
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download distribution tarball
        uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist

      - name: Boot ${{ matrix.os }} VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.architecture }}
          memory: 5G
          cpu_count: 2

      - name: Run -Wall -Werror build
        run: CI_INSTALL_DEPS=1 sh .github/ci/run-warning-target.sh '${{ matrix.slug }}'

      - name: Report warning-build failure
        id: warning_result
        if: always()
        shell: bash
        run: sh .github/ci/check-warning-result.sh '${{ matrix.slug }}'

      - name: Upload warning-build log
        if: always() && steps.warning_result.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: warnings-${{ matrix.slug }}
          path: .ci-warning-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
    continue-on-error: true
  netbsd-vm:
    name: Build & test — NetBSD 11.0 (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist
      - name: Build and test in NetBSD 11.0
        uses: vmactions/netbsd-vm@v1.4.6
        with:
          release: '11.0'
          usesh: true
          sync: scp
          run: |
            CI_INSTALL_DEPS=1 sh .github/ci/run-target.sh netbsd-11.0-x86_64
            exit 0
      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-netbsd-11.0-x86_64
          path: .ci-output/netbsd-11.0-x86_64
          if-no-files-found: warn
          retention-days: 30
      - name: Propagate target failure
        run: sh .github/ci/check-result.sh netbsd-11.0-x86_64

  warnings-netbsd-vm:
    name: Warnings — NetBSD 11.0 (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist
      - name: Run -Wall -Werror build
        uses: vmactions/netbsd-vm@v1.4.6
        with:
          release: '11.0'
          usesh: true
          sync: scp
          run: |
            CI_INSTALL_DEPS=1 sh .github/ci/run-warning-target.sh netbsd-11.0-x86_64
            exit 0
      - name: Report warning-build failure
        id: warning_result
        if: always()
        run: sh .github/ci/check-warning-result.sh 'netbsd-11.0-x86_64'

      - name: Upload warning-build log
        if: always() && steps.warning_result.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: warnings-netbsd-11.0-x86_64
          path: .ci-warning-output/netbsd-11.0-x86_64
          if-no-files-found: warn
          retention-days: 14
    continue-on-error: true
  solaris-vm:
    name: Build & test — Oracle Solaris 11.4 CBE (GCC, x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist
      - name: Build and test in Oracle Solaris 11.4 CBE
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: '11.4-gcc'
          usesh: true
          sync: scp
          prepare: |
            command -v gmake >/dev/null 2>&1 || pkg install -v developer/build/gnu-make
          run: |
            CC=gcc MAKE=gmake sh .github/ci/run-target.sh solaris-11.4-gcc-x86_64
      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-solaris-11.4-gcc-x86_64
          path: .ci-output/solaris-11.4-gcc-x86_64
          if-no-files-found: warn
          retention-days: 30
      - name: Propagate target failure
        run: sh .github/ci/check-result.sh solaris-11.4-gcc-x86_64

  warnings-solaris-vm:
    name: Warnings — Oracle Solaris 11.4 CBE (GCC, x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'extended'
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist
      - name: Run -Wall -Werror build
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: '11.4-gcc'
          usesh: true
          sync: scp
          prepare: |
            command -v gmake >/dev/null 2>&1 || pkg install -v developer/build/gnu-make
          run: |
            CC=gcc MAKE=gmake sh .github/ci/run-warning-target.sh solaris-11.4-gcc-x86_64
      - name: Report warning-build failure
        id: warning_result
        if: always()
        run: sh .github/ci/check-warning-result.sh 'solaris-11.4-gcc-x86_64'

      - name: Upload warning-build log
        if: always() && steps.warning_result.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: warnings-solaris-11.4-gcc-x86_64
          path: .ci-warning-output/solaris-11.4-gcc-x86_64
          if-no-files-found: warn
          retention-days: 14
    continue-on-error: true
  linux-vm-extended:
    name: Build & test (extended) — ${{ matrix.label }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'core') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[extended]'))
    needs: dist
    strategy:
      fail-fast: false
      matrix: &linux_extended_matrix
        include:
          - slug: debian-12-x86_64
            template: debian-12
            label: Debian 12 (x86_64)
          - slug: fedora-43-x86_64
            template: fedora-43
            label: Fedora 43 (x86_64)
          - slug: almalinux-8-x86_64
            template: almalinux-8
            label: AlmaLinux 8 (x86_64)
          - slug: almalinux-9-x86_64
            template: almalinux-9
            label: AlmaLinux 9 (x86_64)
          - slug: centos-stream-10-x86_64
            template: centos-stream-10
            label: CentOS Stream 10 (x86_64)
          - slug: oraclelinux-10-x86_64
            template: oraclelinux-10
            label: Oracle Linux 10 (x86_64)
          - slug: alpine-3.22-x86_64
            template: alpine-3.22
            label: Alpine Linux 3.22 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist
      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
      - name: Boot Linux VM
        run: |
          set -euxo pipefail
          sh .github/ci/start-lima.sh '${{ matrix.template }}'
          limactl shell default -- sh -c 'rm -rf /tmp/libstatgrab && mkdir -p /tmp/libstatgrab'
          limactl copy --backend=scp -r .github dist default:/tmp/libstatgrab/
      - name: Build, smoke-test and run test suite in VM
        run: >-
          limactl shell default -- sh -c
          "cd /tmp/libstatgrab && CI_INSTALL_DEPS=1 sh .github/ci/run-target.sh '${{ matrix.slug }}'"
      - name: Copy result out of VM
        if: always()
        run: |
          mkdir -p .ci-output
          limactl copy --backend=scp -r \
            default:/tmp/libstatgrab/.ci-output/${{ matrix.slug }} \
            .ci-output/ || true
      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.slug }}
          path: .ci-output/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Linux VM
        if: always()
        run: limactl stop default || true
      - name: Propagate target failure
        run: sh .github/ci/check-result.sh '${{ matrix.slug }}'

  warnings-linux-vm-extended:
    name: Warnings (extended) — ${{ matrix.label }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'core') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[extended]'))
    needs: dist
    strategy:
      fail-fast: false
      matrix: *linux_extended_matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distfile
          path: dist
      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
      - name: Boot Linux VM
        run: |
          set -euxo pipefail
          sh .github/ci/start-lima.sh '${{ matrix.template }}'
          limactl shell default -- sh -c 'rm -rf /tmp/libstatgrab && mkdir -p /tmp/libstatgrab'
          limactl copy --backend=scp -r .github dist default:/tmp/libstatgrab/
      - name: Run -Wall -Werror build
        run: >-
