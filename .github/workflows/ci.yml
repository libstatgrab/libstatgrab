  regression:
    name: Platform regression check
    if: always() && needs.dist.result == 'success'
    needs:
      - dist
      - native
      - linux-vm
      - unix-vm
      - netbsd-vm
      - solaris-vm
      - linux-vm-extended
      - unix-vm-extended
      - freebsd-vm-extended
      - netbsd-vm-extended
      - solaris-vm-extended
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: platform-*
          path: .ci-current

      - name: Normalize current results
        run: sh .github/ci/regression.sh normalize .ci-current .ci-normalized

      - name: Check out persistent default-branch baseline
        run: |
          set -eu
          REF_WORKTREE='${{ runner.temp }}/libstatgrab-ci-reference'
          rm -rf "$REF_WORKTREE"
          if git fetch --no-tags origin ci-baseline:refs/remotes/origin/ci-baseline; then
            git worktree add --detach "$REF_WORKTREE" origin/ci-baseline
          else
            mkdir -p "$REF_WORKTREE/baseline"
            echo "No ci-baseline branch exists yet"
          fi

      - name: Compare with default-branch baseline
        # A forced default-branch baseline publish is an explicit acknowledgement
        # that the current schema/config changes are intentional. Normal runs,
        # including ordinary default-branch pushes, must gate on regressions.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'all' && inputs.publish_baseline == true }}
        run: >-
          sh .github/ci/regression.sh compare
          .ci-normalized
          '${{ runner.temp }}/libstatgrab-ci-reference/baseline'

  baseline-publish:
    name: Publish platform regression baseline
    # Automatic publication is default-branch-only and requires every selected
    # target plus the regression comparison to pass. A manual default-branch run
    # can explicitly force baseline publication from the successful artifacts,
    # which is useful while bringing a newly added platform online. Feature
    # branches can never publish.
    if: >-
      always() &&
      github.repository == 'libstatgrab/libstatgrab' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.dist.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.scope == 'all' && inputs.publish_baseline == true) ||
        (
          needs.native.result == 'success' &&
          needs.linux-vm.result == 'success' &&
          needs.unix-vm.result == 'success' &&
          needs.netbsd-vm.result == 'success' &&
          needs.solaris-vm.result == 'success' &&
          needs.regression.result == 'success' &&
          (needs.linux-vm-extended.result == 'success' || needs.linux-vm-extended.result == 'skipped') &&
          (needs.unix-vm-extended.result == 'success' || needs.unix-vm-extended.result == 'skipped') &&
          (needs.freebsd-vm-extended.result == 'success' || needs.freebsd-vm-extended.result == 'skipped') &&
          (needs.netbsd-vm-extended.result == 'success' || needs.netbsd-vm-extended.result == 'skipped') &&
          (needs.solaris-vm-extended.result == 'success' || needs.solaris-vm-extended.result == 'skipped')
        )
      )
    needs:
      - dist
      - native
      - linux-vm
      - unix-vm
      - netbsd-vm
      - solaris-vm
      - linux-vm-extended
      - unix-vm-extended
      - freebsd-vm-extended
      - netbsd-vm-extended
      - solaris-vm-extended
      - regression
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v7

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: platform-*
          path: .ci-current

      - name: Note forced baseline publication
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all' && inputs.publish_baseline == true
        run: >-
          echo '::warning::Forced baseline publication is enabled; failed platform artifacts will be excluded and successful artifacts will be published.'

      - name: Normalize current results
        run: sh .github/ci/regression.sh normalize .ci-current .ci-normalized

      - name: Check out existing baseline
        run: |
          set -eu
          REF_WORKTREE='${{ runner.temp }}/libstatgrab-ci-reference'
          rm -rf "$REF_WORKTREE"
          if git fetch --no-tags origin ci-baseline:refs/remotes/origin/ci-baseline; then
            git worktree add --detach "$REF_WORKTREE" origin/ci-baseline
          else
            mkdir -p "$REF_WORKTREE/baseline"
            echo "No ci-baseline branch exists yet"
          fi

      - name: Prepare updated baseline
        run: |
          set -eu
          sh .github/ci/regression.sh merge \
            .ci-normalized \
            '${{ runner.temp }}/libstatgrab-ci-reference/baseline' \
            .ci-publish
          printf '%s\n' "$GITHUB_SHA" > .ci-publish/SOURCE_SHA
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .ci-publish/UPDATED_AT

      - name: Publish updated baseline branch
        run: |
          set -euxo pipefail
          WT='${{ runner.temp }}/libstatgrab-ci-baseline-publish'
          rm -rf "$WT"

          if git show-ref --verify --quiet refs/remotes/origin/ci-baseline; then
            git worktree add -B ci-baseline "$WT" origin/ci-baseline
          else
            git worktree add --detach "$WT" HEAD
            (
              cd "$WT"
              git checkout --orphan ci-baseline
              git rm -rf .
            )
          fi

          rm -rf "$WT/baseline"
          mkdir -p "$WT/baseline"
          cp -R .ci-publish/. "$WT/baseline/"
          cat > "$WT/README.md" <<'EON'
          # libstatgrab CI regression baseline

          This branch is maintained automatically by `.github/workflows/ci.yml`.
          It contains normalized `statgrab` capability schemas, diagnostic key
          inventories, and `config.h` snapshots from successful default-branch CI
          runs. Do not edit it by hand.
          EON

          (
            cd "$WT"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if git diff --cached --quiet; then
              echo 'CI baseline is unchanged'
            else
              git commit -m "CI baseline for $GITHUB_SHA"
              git push origin HEAD:ci-baseline
            fi
          )
